    <h1>Kontakt</h1>
  <div class="grid" style="align-items: center;">
    <div>
      <figure>
        <img src="../img/Pessoa_de_perfil_utilizando_um_smartphone.png" alt=""

        </figcaption>
      </figure>
    </div>
    <div>
      <form aria-label="Kontaktformular">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Vorname Nachname" required>
        <label for="email">E-Mail</label>
        <input type="email" id="email" placeholder="vorname@nachname.at" required>
        <label for="message">Nachricht</label>
        <textarea id="message" placeholder="Ich liebe euren Kalender, aber ..." required></textarea>
        <button type="submit">Absenden</button>
      </form>
    </div>
  </div>
